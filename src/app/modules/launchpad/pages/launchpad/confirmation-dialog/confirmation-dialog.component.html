<h1 mat-dialog-title>Confirm Deactivation</h1>
<div mat-dialog-content>
  Are you sure you want to deactivate this designation?
</div>
<div mat-dialog-actions class="d-flex justify-content-end">
  <button mat-button class="mat-raised-button mat-primary" (click)="cancel()">
    Cancel
  </button>
  <button mat-button class="mat-stroked-button mat-warn" (click)="confirm()">
    Yes
  </button>
</div>

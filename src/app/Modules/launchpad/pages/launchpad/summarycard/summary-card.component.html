<div class="flex-1 d-flex justify-content-center">

    <mat-card-header class="d-flex align-items-center p-2 mt-1">
      <mat-card-title-group class="p-3">
        <mat-card-title class="fs-2 mat-card-title-number text-center mb-1">{{total}}</mat-card-title>
        <mat-card-title class="fs-5 text-center">{{title}} </mat-card-title>
      </mat-card-title-group>
    </mat-card-header>
  </mat-card>
</div>

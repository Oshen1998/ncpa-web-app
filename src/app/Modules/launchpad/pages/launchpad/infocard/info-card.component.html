<div class="col">
  <mat-card class="mt-2">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title>{{ designation }}</mat-card-title>
        <mat-card-subtitle>{{ salaryCategory }}</mat-card-subtitle>
        <mat-slide-toggle
          [color]="color"
          [checked]="isAssigned"
        >
        </mat-slide-toggle>
      </mat-card-title-group>
    </mat-card-header>
  </mat-card>
</div>

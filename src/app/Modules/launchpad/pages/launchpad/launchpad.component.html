<div class="content mat-elevation-z8">
  <div class="container-fluid">
    <div class="mt-3">
      
      <h1>Launchpad</h1>
      <mat-divider></mat-divider>
    </div>

    <!-- Summary Section Start-->
    <div class="mt-2">
      <h2>Summary</h2>
    </div>
    <div class="row">
      <div class="card-grid">
        <div *ngFor="let summarycard of summaryCardData">
          <summary-card
            [total]="summarycard.total"
            [title]="summarycard.title"
          />
        </div>
      </div>
    </div>
    <!-- Summary Section End-->

    <mat-divider class="mt-3"></mat-divider>

    <!-- Enabled Designations Section Start-->
    <div class="mt-3">
      <h2>Opened Designations</h2>
    </div>
    <div class="row">
      <div class="card-grid">
        <div *ngFor="let card of cardData">
          <info-card
            [designation]="card.designation"
            [salaryCategory]="card.salaryCategory"
            [isAssigned]="card.isAssigned"
          />
        </div>
      </div>
    </div>
    <!-- Enabled Designations Section End-->

  </div>
</div>

<form [formGroup]="getFormGroup('olResult')">
    <div class="row col-12" style="margin-bottom: 16px; align-items: center;">

        <mat-form-field class="col-lg-6" appearance="outline">
            <mat-label>Religion</mat-label>
            <mat-select matNativeControl formControlName="religion">

                <mat-option *ngFor=" let subject of getSubjects('religion').subjects" [value]="subject.key">
                    {{subject.value}}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field class="col-lg-6" appearance="outline">
            <mat-label>Grade</mat-label>

            <select matNativeControl formControlName="religionGrade">
                <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
            </select>
        </mat-form-field>
    </div>
    <div class="row col-12" style="margin-bottom: 16px; align-items: center;">

        <mat-form-field class="col-lg-6" appearance="outline">

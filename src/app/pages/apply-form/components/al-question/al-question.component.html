<div class="row col-12" style="margin-bottom: 16px;   align-items: center;">

    <mat-form-field class="col-lg-6" appearance="outline">

        <mat-select value="buddhism">

            <mat-option value="buddhism">General Knowledge </mat-option>

        </mat-select>
    </mat-form-field>
    <mat-form-field class="col-lg-6" appearance="outline">
        <mat-label>Grade</mat-label>

        <select matNativeControl>
            <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
        </select>
    </mat-form-field>

    <mat-form-field class="col-lg-6" appearance="outline">

        <mat-select value="buddhism">

            <mat-option value="buddhism">English </mat-option>

        </mat-select>
    </mat-form-field>
    <mat-form-field class="col-lg-6" appearance="outline">
        <mat-label>Grade</mat-label>

        <select matNativeControl>
            <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
        </select>
    </mat-form-field>

</div>

<div class="row col-12" style="margin-bottom: 16px; align-items: center;">

    <mat-form-field class="col-12" appearance="outline">
        <mat-label>Stream</mat-label>
        <mat-select [(ngModel)]="stream">

            <mat-option value="biology">Biology </mat-option>
            <mat-option value="maths"> Mathematics </mat-option>

        </mat-select>


    </mat-form-field>



</div>



<div [ngSwitch]="stream">
    <div *ngSwitchCase="'maths'">
        <div class="row col-12" style="margin-bottom: 16px;   align-items: center;">

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 1</mat-label>
                <mat-select>

                    <mat-option value="buddhism">Mathematics </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 2</mat-label>
                <mat-select>

                    <mat-option value="buddhism">Physics </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 3</mat-label>
                <mat-select>

                    <mat-option value="buddhism">Information and Communication Technology </mat-option>
                    <mat-option value="buddhism">Chemsitry </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>
        </div>
    </div>
    <div *ngSwitchCase="'biology'">
        <div class="row col-12" style="margin-bottom: 16px;   align-items: center;">

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 1</mat-label>
                <mat-select>

                    <mat-option value="buddhism">Biology </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 2</mat-label>
                <mat-select>

                    <mat-option value="buddhism">Physics </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>

            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Subject 3</mat-label>
                <mat-select>


                    <mat-option value="buddhism">Chemsitry </mat-option>

                </mat-select>
            </mat-form-field>
            <mat-form-field class="col-lg-6" appearance="outline">
                <mat-label>Grade</mat-label>

                <select matNativeControl>
                    <option *ngFor="let grade of grades" [value]="grade">{{grade}}</option>
                </select>
            </mat-form-field>
        </div>
    </div>
</div>

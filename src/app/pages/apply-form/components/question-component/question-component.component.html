<div [ngSwitch]="question.controlType" class="">
  <mat-form-field
    *ngSwitchCase="'textbox'"
    appearance="outline"
    [formGroup]="form"
    class="col-lg-12"
  >
    <mat-label [attr.for]="question.key" class="form-label">{{
      question.label
    }}</mat-label>
    <input
      matInput
      *ngSwitchCase="'textbox'"
      [formControlName]="question.key"
      [id]="question.key"
      [type]="question.type"
      matNativeControl
    />
    <mat-error *ngIf="!isValid">
      {{ question.label }} <strong>is required</strong>
    </mat-error>
  </mat-form-field>

  <mat-form-field
    *ngSwitchCase="'dropdown'"
    appearance="outline"
    [formGroup]="form"
    class="col-lg-12"
  >
    <mat-label [attr.for]="question.key" class="form-label">{{
      question.label
    }}</mat-label>

    <mat-select [id]="question.key" [formControlName]="question.key">
      <mat-option *ngFor="let opt of question.options" [value]="opt.key">{{
        opt.value
      }}</mat-option>
    </mat-select>

    <mat-error *ngIf="!isValid">
      {{ question.label }} <strong>is required</strong>
    </mat-error>
  </mat-form-field>

  <div *ngSwitchCase="'olResult'" class="col-lg-12">
    <app-ol-question [form]="form" />
  </div>

  <div *ngSwitchCase="'alResult'" class="col-lg-12">
    <app-al-question [form]="form" />
  </div>

  <div *ngSwitchCase="'degree'" class="col-lg-12">
    <app-degree-question [form]="form" />
  </div>
  <div *ngSwitchCase="'masters'" class="col-lg-12">
    <app-masters-question [form]="form" />
  </div>
  <div *ngSwitchCase="'professional'" class="col-lg-12">
    <app-professional-question [form]="form" />
  </div>
  <div *ngSwitchCase="'work'" class="col-lg-12">
    <app-work-question [form]="form" />
  </div>
  <div *ngSwitchCase="'other'" class="col-lg-12">
    <app-other-question [form]="form" />
  </div>
</div>

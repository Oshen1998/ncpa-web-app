<mat-form-field appearance="fill" [formGroup]="form" class="col-lg-12">
    <mat-label [attr.for]="question.key" class="form-label">{{question.label}}</mat-label>

    <div [ngSwitch]="question.controlType" class="">



        <input matInput *ngSwitchCase="'textbox'" [formControlName]="question.key" [id]="question.key"
            [type]="question.type">


        <mat-select [id]="question.key" *ngSwitchCase="'dropdown'" [formControlName]="question.key">
            <mat-option *ngFor="let opt of question.options" [value]="opt.key">{{opt.value}}</mat-option>
        </mat-select>

    </div>

    <div class="form-text text-danger " *ngIf="!isValid">{{question.label}} is required</div>
</mat-form-field>

<div>
    <form class="container" (ngSubmit)="onSubmit()" [formGroup]="form">
        <div class="row mt-4">

            <!-- <app-question-component class="{{question.className}}" *ngFor="let question of questions"
                [question]="question" [form]="form">
            </app-question-component> -->

            <app-form-page *ngFor="let page of pages" [page]="page" [form]="form">

            </app-form-page>



            <div class=" row d-flex justify-content-center">
                <button mat-raised-button color="primary" class="col-4 mt-4" type="submit" [disabled]="!form.valid">
                    Save
                </button>
            </div>
        </div>
    </form>

    <div *ngIf="payLoad" class="">
        <strong>Saved the following values</strong><br>{{payLoad}}
    </div>
</div>

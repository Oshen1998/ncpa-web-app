<div>
    <form class="container" (ngSubmit)="onSubmit()" [formGroup]="form">
        <div class="row mt-4">
            <div *ngFor="let question of questions" class="col-12">
                <app-question-component [question]="question" [form]="form"></app-question-component>
                <hr class="hr" />
            </div>

            <div class=" row d-flex justify-content-center">
                <button class="btn btn-primary col-4 mt-4" type="submit" [disabled]="!form.valid">Save</button>
            </div>
        </div>
    </form>

    <div *ngIf="payLoad" class="">
        <strong>Saved the following values</strong><br>{{payLoad}}
    </div>
</div>
